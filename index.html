<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mansa Podcaster — Bibliothèque</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d12;--panel:#13131a;--border:#252535;
  --accent:#7c6fff;--success:#3dd9a4;--warn:#ffb347;
  --text:#ddddf0;--dim:#55556a;--entry:#1e1e2c;--r:10px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:160px}

/* Header */
.header{background:#13131a;border-bottom:1px solid var(--border);padding:12px 18px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px}
.logo{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--accent)}
.sub{font-size:10px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.header-right{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.manage-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--dim);padding:4px 10px;cursor:pointer;font-size:11px;margin-left:8px;transition:border-color .15s}
.manage-btn:hover{border-color:var(--accent);color:var(--text)}

/* Search */
.search-bar{padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border)}
.search-input{width:100%;background:var(--entry);border:1px solid var(--border);border-radius:var(--r);color:var(--text);padding:9px 12px;font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}

/* Manage panel */
.manage-panel{display:none;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 18px;max-height:260px;overflow-y:auto}
.manage-panel.open{display:block}
.manage-title{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.manage-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #1a1a28}
.manage-item:last-child{border-bottom:none}
.manage-name{flex:1;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.manage-name.hidden{color:var(--dim);text-decoration:line-through}
.toggle-btn{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--entry);color:var(--text);transition:all .15s}
.toggle-btn.visible{border-color:var(--success);color:var(--success)}
.toggle-btn.hidden-btn{border-color:var(--dim);color:var(--dim)}

/* Library */
.library{padding:14px 18px;max-width:860px;margin:0 auto}
.lib-title{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}

/* Track card */
.track-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:border-color .15s;cursor:pointer}
.track-card:hover{border-color:#3a3a5a}
.track-card.active{border-color:var(--accent)}
.track-header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.play-btn{width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:13px;cursor:pointer;flex-shrink:0;transition:transform .15s,filter .15s}
.play-btn:hover{transform:scale(1.1);filter:brightness(1.15)}
.play-btn.playing{background:var(--success);color:#000}
.track-info{flex:1;min-width:0}
.track-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.track-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
.resume-tag{color:var(--warn)!important}
.prog-mini{width:70px;height:3px;background:var(--entry);border-radius:2px;overflow:hidden;margin-top:4px}
.prog-mini-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.expand-btn{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:4px 6px;transition:color .15s}
.expand-btn:hover{color:var(--text)}

/* Chapters */
.chapters-panel{border-top:1px solid var(--border);background:#0f0f18;display:none}
.chapters-panel.open{display:block}
.ch-title-bar{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;padding:7px 14px 3px}
.ch-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;transition:background .12s;border-bottom:1px solid #1a1a28}
.ch-item:last-child{border-bottom:none}
.ch-item:hover{background:#1a1a2e}
.ch-item.active{background:#18182e}
.ch-item.done .ch-dot{background:var(--success)!important}
.ch-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);width:22px;flex-shrink:0}
.ch-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.ch-item.active .ch-dot{background:var(--accent)}
.ch-item.active .ch-text{color:var(--accent)}
.ch-text{flex:1;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);flex-shrink:0}
/* Sub-chapters */
.ch-item.sub{padding-left:28px;background:#0c0c16}
.ch-item.sub .ch-num{font-size:9px;color:#3a3a5a}
.ch-item.sub .ch-text{font-size:11px;color:var(--dim)}
.ch-item.sub .ch-dot{width:4px;height:4px;background:#2a2a3a}
.ch-item.sub:hover{background:#141420}
.ch-item.sub.active .ch-text{color:var(--accent)}

/* Player bar */
.player-bar{position:fixed;bottom:0;left:0;right:0;background:#0a0a12;border-top:1px solid var(--border);z-index:200;padding:8px 18px 14px}
.now-playing{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);margin-bottom:6px;white-space:normal;overflow:hidden;line-height:1.4;min-height:14px}
.now-playing span{color:var(--accent)}
.controls{display:flex;align-items:center;gap:8px}
.ctrl{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:4px;transition:color .15s,transform .1s;flex-shrink:0}
.ctrl:hover{color:var(--text);transform:scale(1.1)}
.ctrl.main{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0}
.ctrl.main:hover{filter:brightness(1.15)}
.ctrl.sm{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--entry);border:1px solid var(--border);color:var(--dim);border-radius:4px;padding:3px 7px;cursor:pointer;flex-shrink:0;transition:all .15s}
.ctrl.sm:hover{border-color:var(--accent);color:var(--text)}
.prog-wrap{flex:1}
.prog-track{width:100%;height:6px;background:var(--entry);border-radius:4px;cursor:pointer;position:relative;overflow:visible;margin-bottom:3px;touch-action:none}
.prog-track::before{content:'';position:absolute;top:-8px;bottom:-8px;left:0;right:0;}
.prog-fill{height:100%;background:var(--accent);border-radius:3px;pointer-events:none;transition:width .1s linear;position:relative}
.prog-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .15s;pointer-events:none}
.prog-track:hover .prog-fill::after{opacity:1}
.loop-zone{position:absolute;top:0;bottom:0;background:rgba(124,111,255,.2);pointer-events:none;border:none}
.loop-handle{position:absolute;top:50%;transform:translateY(-50%);width:14px;height:22px;border-radius:4px;background:var(--accent);cursor:ew-resize;display:none;z-index:10;touch-action:none;box-shadow:0 0 6px rgba(124,111,255,.8)}
.loop-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:10px;background:rgba(255,255,255,.6);border-radius:2px}
#loop-handle-a{border-radius:4px 0 0 4px}
#loop-handle-b{border-radius:0 4px 4px 0}
.ch-markers{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.ch-marker{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.2)}
.time-row{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim)}
.loop-info{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent)}
.loop-controls{display:flex;gap:3px;flex-shrink:0}
.loop-btn{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;background:var(--entry);border:1px solid var(--border);color:var(--dim);border-radius:4px;padding:3px 8px;cursor:pointer;transition:all .15s}
.loop-btn:hover{border-color:var(--accent);color:var(--text)}
.loop-btn.set{border-color:var(--accent);color:var(--accent)}
.loop-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.speed-btn{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--entry);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 8px;cursor:pointer;flex-shrink:0;transition:border-color .15s}
.speed-btn:hover{border-color:var(--accent)}

/* Loading */
.loading{text-align:center;padding:50px 20px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim)}
.spinner{font-size:26px;display:block;margin-bottom:10px;animation:spin 1.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.setup-box{background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:18px;margin:16px 0}
.setup-box h3{font-family:'JetBrains Mono',monospace;color:var(--accent);margin-bottom:10px}
.setup-box p{font-size:12px;color:var(--dim);line-height:1.7;margin-bottom:6px}
.setup-box code{background:var(--entry);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--success)}
@media(max-width:600px){
  body{padding-bottom:185px}
  .header,.library{padding:10px 12px}
  .player-bar{padding:8px 12px 12px}
  .ctrl.sm{padding:4px 6px;font-size:10px}
  .loop-btn{padding:4px 8px}
}

/* Mode paysage plein écran */
@media(orientation:landscape){
  #fs-body{flex-direction:row!important}
  #fs-cover{border-right:1px solid var(--border);min-width:0}
  #fs-chapters{display:block!important;width:280px}
  #fs-thumb{max-width:200px!important;margin-bottom:10px!important}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">🎧 Mansa Podcaster</div>
    <div class="sub" id="folder-name">Podcast EEA Certif 2026</div>
  </div>
  <div class="header-right" id="header-info">Chargement…</div>
  <button class="manage-btn" onclick="toggleManage()">👁 Gérer</button>
</div>

<div class="search-bar">
  <input class="search-input" id="search" type="text"
         placeholder="🔍  Rechercher un podcast…" oninput="filterTracks()">
</div>

<div class="manage-panel" id="manage-panel">
  <div class="manage-title">Gérer l'affichage</div>
  <div id="manage-list"></div>
</div>

<div class="library">
  <div class="lib-title">Podcasts</div>
  <div id="track-list"><div class="loading"><span class="spinner">⟳</span>Chargement…</div></div>
</div>

<div class="player-bar">
  <div class="now-playing" id="now-playing">Aucun podcast sélectionné</div>

  <!-- Ligne 1 : navigation -->
  <div class="controls" style="margin-bottom:6px">
    <button class="ctrl" onclick="skipChapter(-1)" title="Chapitre précédent">⏮</button>
    <button class="ctrl sm" onclick="seek(-10)">-10</button>
    <button class="ctrl sm" onclick="seek(-5)">-5</button>
    <button class="ctrl main" id="play-btn" onclick="togglePlay()">▶</button>
    <button class="ctrl sm" onclick="seek(5)">+5</button>
    <button class="ctrl sm" onclick="seek(10)">+10</button>
    <button class="ctrl" onclick="skipChapter(1)" title="Chapitre suivant">⏭</button>
  </div>

  <!-- Barre de progression -->
  <div class="prog-wrap" style="margin-bottom:6px">
    <div class="prog-track" id="prog-track" onclick="seekTo(event)">
      <div class="prog-fill" id="prog-fill" style="width:0%"></div>
      <div class="loop-zone" id="loop-zone" style="display:none"></div>
      <div id="loop-handle-a" class="loop-handle"></div>
      <div id="loop-handle-b" class="loop-handle"></div>
      <div class="ch-markers" id="ch-markers"></div>
    </div>
    <div class="time-row">
      <span id="t-cur">0:00</span>
      <span class="loop-info" id="loop-info"></span>
      <span id="t-dur">0:00</span>
    </div>
  </div>

  <!-- Ligne 2 : boucle A-B + vitesse + plein écran -->
  <div class="controls" style="justify-content:space-between">
    <div class="loop-controls">
      <button class="loop-btn" id="btn-a" onclick="setLoopA()" title="Marquer début">A</button>
      <button class="loop-btn" id="btn-b" onclick="setLoopB()" title="Marquer fin">B</button>
      <button class="loop-btn" id="btn-loop" onclick="toggleLoop()" title="Activer boucle">↻</button>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="speed-btn" id="speed-btn" onclick="cycleSpeed()">1.0x</button>
      <button class="ctrl sm" onclick="openFullscreen()" title="Mode plein écran">⛶</button>
    </div>
  </div>
</div>

<!-- Overlay plein écran -->
<div id="fs-overlay" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--bg);flex-direction:column;">

  <!-- Header plein écran -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#0a0a10;border-bottom:1px solid var(--border);flex-shrink:0">
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent)">🎧 Mansa Podcaster</div>
    <button onclick="closeFullscreen()" style="background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--dim);padding:4px 12px;cursor:pointer;font-size:12px">✕ Fermer</button>
  </div>

  <!-- Corps : portrait → vertical | paysage → horizontal -->
  <div id="fs-body" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0">

    <!-- Miniature + titre -->
    <div id="fs-cover" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;min-height:0;overflow:hidden">
      <div id="fs-thumb" style="width:100%;max-width:320px;aspect-ratio:1;border-radius:16px;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#252540);box-shadow:0 8px 32px rgba(124,111,255,.2)">
        <img id="fs-img" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none">
        <div id="fs-fallback" style="text-align:center;padding:20px">
          <div style="font-size:48px;margin-bottom:12px">🎧</div>
          <div id="fs-fallback-title" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);word-break:break-word;text-align:center"></div>
        </div>
      </div>
      <div id="fs-title" style="font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:var(--text);text-align:center;max-width:500px;word-break:break-word"></div>
      <div id="fs-badge" style="margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)"></div>
    </div>

    <!-- Chapitres (paysage uniquement) -->
    <div id="fs-chapters" style="display:none;width:300px;flex-shrink:0;overflow-y:auto;border-left:1px solid var(--border);padding:10px 0"></div>

  </div>

  <!-- Player plein écran -->
  <div style="background:#0a0a10;border-top:1px solid var(--border);padding:14px 20px;flex-shrink:0">
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;flex-wrap:wrap">
      <button onclick="skipChapter(-1)" style="background:transparent;border:none;color:var(--dim);font-size:22px;cursor:pointer">⏮</button>
      <button onclick="seek(-10)" style="font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--entry);border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:5px 10px;cursor:pointer">-10</button>
      <button onclick="seek(-5)" style="font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--entry);border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:5px 10px;cursor:pointer">-5</button>
      <button id="fs-play-btn" onclick="togglePlay()" style="width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center">▶</button>
      <button onclick="seek(5)" style="font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--entry);border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:5px 10px;cursor:pointer">+5</button>
      <button onclick="seek(10)" style="font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--entry);border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:5px 10px;cursor:pointer">+10</button>
      <button onclick="skipChapter(1)" style="background:transparent;border:none;color:var(--dim);font-size:22px;cursor:pointer">⏭</button>
      <div style="display:flex;gap:4px">
        <button id="fs-btn-a" onclick="setLoopA()" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;background:var(--entry);border:1px solid var(--border);color:var(--dim);border-radius:4px;padding:4px 10px;cursor:pointer">A</button>
        <button id="fs-btn-b" onclick="setLoopB()" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;background:var(--entry);border:1px solid var(--border);color:var(--dim);border-radius:4px;padding:4px 10px;cursor:pointer">B</button>
        <button id="fs-btn-loop" onclick="toggleLoop()" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;background:var(--entry);border:1px solid var(--border);color:var(--dim);border-radius:4px;padding:4px 10px;cursor:pointer">↻</button>
      </div>
      <button onclick="cycleSpeed()" id="fs-speed-btn" style="font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--entry);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:4px 10px;cursor:pointer">1.0x</button>
    </div>
    <!-- Barre de progression FS -->
    <div id="fs-prog-track" onclick="fsSeeekTo(event)" style="width:100%;height:6px;background:var(--entry);border-radius:4px;cursor:pointer;position:relative;margin-bottom:6px">
      <div id="fs-prog-fill" style="height:100%;background:var(--accent);border-radius:4px;width:0%;pointer-events:none"></div>
      <div id="fs-loop-zone" style="position:absolute;top:0;bottom:0;background:rgba(124,111,255,.25);display:none;pointer-events:none;border-left:2px solid var(--accent);border-right:2px solid var(--accent)"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)">
      <span id="fs-t-cur">0:00</span>
      <span id="fs-loop-info" style="color:var(--accent)"></span>
      <span id="fs-t-dur">0:00</span>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
// ── Config ────────────────────────────────────────────
const INDEX_FILE_ID = "1EYJ6Jq3VAny05aqR-CP5CZ3e_cjiOfCl";
const API_KEY       = "AIzaSyCuf2U91tVBOopujlfwWuFNnc7b8VVI_uI";

function driveUrl(id) {
  return `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${API_KEY}`;
}

// ── State ─────────────────────────────────────────────
let tracks = [], currentTrack = null, chapters = [];
let loopA = null, loopB = null, loopActive = false;
const speeds = [0.75, 0.85, 1.0, 1.1, 1.25];
let speedIdx = 2;
const audio = document.getElementById("audio");

// ── Storage ───────────────────────────────────────────
const SK = "mansa_progress";
const HK = "mansa_hidden";
const LK = "mansa_last";  // dernier podcast écouté

function saveProgress(id, t) {
  const d = JSON.parse(localStorage.getItem(SK)||"{}");
  d[id] = {time:t, ts:Date.now()};
  localStorage.setItem(SK, JSON.stringify(d));
}
function getProgress(id) {
  return (JSON.parse(localStorage.getItem(SK)||"{}"))[id]?.time || 0;
}
function saveLastTrack(id) {
  localStorage.setItem(LK, id);
}
function getLastTrack() {
  return localStorage.getItem(LK);
}
function getHidden() {
  return JSON.parse(localStorage.getItem(HK)||"[]");
}
function isHidden(id) { return getHidden().includes(id); }
function toggleHidden(id) {
  const h = getHidden();
  const i = h.indexOf(id);
  if (i===-1) h.push(id); else h.splice(i,1);
  localStorage.setItem(HK, JSON.stringify(h));
}

// ── Manage panel ──────────────────────────────────────
function toggleManage() {
  const p = document.getElementById("manage-panel");
  p.classList.toggle("open");
  if (p.classList.contains("open")) renderManage();
}
function renderManage() {
  const el = document.getElementById("manage-list");
  if (!tracks.length) {
    el.innerHTML = `<p style="font-size:12px;color:var(--dim)">Aucun podcast.</p>`;
    return;
  }
  el.innerHTML = tracks.map(t => {
    const h = isHidden(t.id);
    return `<div class="manage-item">
      <span class="manage-name ${h?'hidden':''}">${esc(t.title)}</span>
      <button class="toggle-btn ${h?'hidden-btn':'visible'}"
        onclick="toggleVis('${t.id}')">${h?'👁 Afficher':'🚫 Masquer'}</button>
    </div>`;
  }).join("");
}
function toggleVis(id) {
  toggleHidden(id);
  renderManage();
  filterTracks();
}

// ── Library ───────────────────────────────────────────
async function loadLibrary() {
  const el = document.getElementById("track-list");
  if (!INDEX_FILE_ID) {
    el.innerHTML = `<div class="setup-box">
      <h3>⚙️ Configuration requise</h3>
      <p>Collez votre ID index.json ici :</p>
      <p><code>const INDEX_FILE_ID = "VOTRE_ID";</code></p>
    </div>`;
    return;
  }
  try {
    const res  = await fetch(driveUrl(INDEX_FILE_ID));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.folder) document.getElementById("folder-name").textContent = data.folder;
    tracks = [];
    for (const t of (data.tracks||[])) {
      const track = {
        id: t.mp3_id, title: t.title,
        mp3_url: driveUrl(t.mp3_id),
        chapters: [], duration: 0, added: t.added||""
      };
      if (t.json_id) {
        try {
          const jr = await fetch(driveUrl(t.json_id));
          if (!jr.ok) throw new Error();
          const jd = await jr.json();
          track.chapters  = jd.chapters||[];
          track.duration  = jd.duration||0;
          track.smart     = jd.smart||false;
          track.thumb_url = t.thumb_id ? driveUrl(t.thumb_id) : null;
        } catch(e) { console.warn("JSON non chargé:", t.title); }
      }
      tracks.push(track);
    }
    const visible = tracks.filter(t => !isHidden(t.id));
    renderLibrary(visible);
    document.getElementById("header-info").textContent =
      `${tracks.length} podcast${tracks.length>1?"s":""} · ${data.updated||""}`;

    // ── Reprise automatique du dernier podcast ──────────────────────────
    const lastId = getLastTrack();
    if (lastId) {
      const lastTrack = tracks.find(t => t.id === lastId);
      if (lastTrack) {
        const savedTime = getProgress(lastId);
        if (savedTime > 5) {
          // Sélectionne sans lancer la lecture automatique
          currentTrack = lastTrack;
          chapters     = lastTrack.chapters||[];
          audio.src    = lastTrack.mp3_url;
          audio.load();
          audio.addEventListener("loadedmetadata", () => {
            audio.currentTime = savedTime;
          }, {once: true});
          document.getElementById("now-playing").innerHTML =
            `⏸ <span>${esc(lastTrack.title)}</span> ` +
            `<span style="color:var(--dim);font-size:9px">` +
            `↩ reprend à ${fmt(savedTime)}</span>`;
          // Highlight la carte
          document.querySelectorAll(".track-card")
            .forEach(c => c.classList.remove("active"));
          document.getElementById(`card-${lastId}`)
            ?.classList.add("active");
          updateMediaSession(lastTrack);
        }
      }
    }
  } catch(e) {
    el.innerHTML = `<div class="setup-box">
      <h3>❌ Erreur de chargement</h3>
      <p>${e.message}</p>
      <p>Vérifiez que l'ID <code>${INDEX_FILE_ID}</code> est correct et public.</p>
    </div>`;
    document.getElementById("header-info").textContent = "Erreur";
  }
}

function renderLibrary(list) {
  const el = document.getElementById("track-list");
  list = list.filter(t => !isHidden(t.id));
  if (!list.length) {
    el.innerHTML = `<div class="loading">Aucun podcast affiché.</div>`;
    return;
  }
  el.innerHTML = list.map(track => {
    const saved = getProgress(track.id);
    const pct   = track.duration > 0 ? Math.round((saved/track.duration)*100) : 0;
    const hasResume = saved > 5;

    const chapHtml = track.chapters.length > 0 ? `
    <div class="chapters-panel" id="chp-${track.id}">
      <div class="ch-title-bar">Chapitres</div>
      ${track.chapters.map((ch, ci) => {
        const hasSub = ch.sub && ch.sub.length > 0;
        return `
        <div class="ch-item" id="ch-${track.id}-${ci}"
             onclick="event.stopPropagation();playChapter('${track.id}',${ci})">
          <span class="ch-num">${String(ci+1).padStart(2,"0")}</span>
          <span class="ch-dot"></span>
          <span class="ch-text">${esc(ch.title)}</span>
          <span class="ch-time">${fmt(ch.start)}</span>
        </div>
        ${hasSub ? ch.sub.map(sub => `
        <div class="ch-item sub"
             onclick="event.stopPropagation();seekToTime(${sub.start})">
          <span class="ch-num">└</span>
          <span class="ch-dot"></span>
          <span class="ch-text">${esc(sub.title)}</span>
          <span class="ch-time">${fmt(sub.start)}</span>
        </div>`).join("") : ""}`;
      }).join("")}
    </div>` : "";

    return `
    <div class="track-card" id="card-${track.id}" onclick="selectTrack('${track.id}')">
      <div class="track-header">
        <button class="play-btn" id="pbtn-${track.id}"
                onclick="event.stopPropagation();playTrack('${track.id}')">▶</button>
        <div class="track-info">
          <div class="track-name">${esc(track.title)}</div>
          <div class="track-meta">
            <span>${track.chapters.length} chapitre${track.chapters.length!==1?"s":""}</span>
            ${track.smart?`<span style="color:var(--success);font-weight:600;">🧠 Intelligent</span>`:`<span style="color:var(--dim);">⚡ Standard</span>`}
            ${track.duration>0?`<span>${fmt(track.duration)}</span>`:""}
            ${hasResume?`<span class="resume-tag">⏱ ${fmt(saved)}</span>`:""}
            ${track.added?`<span>${track.added}</span>`:""}
          </div>
          ${pct>0?`<div class="prog-mini"><div class="prog-mini-fill" style="width:${pct}%"></div></div>`:""}
        </div>
        ${track.chapters.length>0?`
        <button class="expand-btn" id="exp-${track.id}"
                onclick="event.stopPropagation();toggleChapters('${track.id}')">📋</button>`:""}
      </div>
      ${chapHtml}
    </div>`;
  }).join("");
}

function filterTracks() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const visible = tracks.filter(t => !isHidden(t.id));
  renderLibrary(q ? visible.filter(t=>t.title.toLowerCase().includes(q)) : visible);
}

// ── Playback ──────────────────────────────────────────
function selectTrack(id) {
  const track = tracks.find(t=>t.id===id);
  if (!track) return;
  document.querySelectorAll(".track-card").forEach(c=>c.classList.remove("active"));
  document.getElementById(`card-${id}`)?.classList.add("active");
  if (currentTrack?.id===id) return;
  currentTrack = track;
  chapters = track.chapters||[];
  audio.src = track.mp3_url;
  audio.load();
  saveLastTrack(track.id);  // ← mémorise le dernier podcast
  const saved = getProgress(id);
  if (saved>5) audio.addEventListener("loadedmetadata",()=>{audio.currentTime=saved;},{once:true});
  document.getElementById("now-playing").innerHTML = `🎧 <span>${esc(track.title)}</span>`;
  resetLoop();
  renderChMarkers();
  updateMediaSession(track);  // ← Media Session Android/iOS
  audio.play().catch(console.warn);
}

function playTrack(id) {
  if (currentTrack?.id===id) togglePlay(); else selectTrack(id);
}
function playChapter(id, ci) {
  const track = tracks.find(t=>t.id===id);
  if (!track) return;
  if (currentTrack?.id!==id) {
    selectTrack(id);
    audio.addEventListener("loadedmetadata",()=>{
      audio.currentTime = track.chapters[ci].start;
      audio.play();
    },{once:true});
  } else {
    audio.currentTime = track.chapters[ci].start;
    audio.play();
  }
}
function seekToTime(s) { audio.currentTime=s; if(audio.paused) audio.play(); }
function togglePlay() { if(!currentTrack) return; audio.paused ? audio.play() : audio.pause(); }
function seek(s) { audio.currentTime=Math.max(0,Math.min(audio.duration||0,audio.currentTime+s)); }
function seekTo(e) {
  const r = document.getElementById("prog-track").getBoundingClientRect();
  audio.currentTime = ((e.clientX-r.left)/r.width)*(audio.duration||0);
}

// ── Drag sur la barre de progression ─────────────────
let isDragging = false;
const progTrack = document.getElementById("prog-track");

function getSeekTime(e) {
  const r   = progTrack.getBoundingClientRect();
  const x   = (e.touches ? e.touches[0].clientX : e.clientX);
  const pct = Math.max(0, Math.min(1, (x - r.left) / r.width));
  return pct * (audio.duration || 0);
}

progTrack.addEventListener("mousedown",  e => { isDragging=true; audio.currentTime=getSeekTime(e); });
progTrack.addEventListener("touchstart", e => { isDragging=true; audio.currentTime=getSeekTime(e); }, {passive:true});
document.addEventListener("mousemove",   e => { if(isDragging) audio.currentTime=getSeekTime(e); });
document.addEventListener("touchmove",   e => { if(isDragging) audio.currentTime=getSeekTime(e); }, {passive:true});
document.addEventListener("mouseup",     () => { isDragging=false; });
document.addEventListener("touchend",    () => { isDragging=false; });
function skipChapter(dir) {
  if (!chapters.length) { seek(dir*30); return; }
  const cur = audio.currentTime;
  if (dir>0) { const n=chapters.find(c=>c.start>cur+1); if(n) audio.currentTime=n.start; }
  else { const p=[...chapters].reverse().find(c=>c.start<cur-2); audio.currentTime=p?p.start:0; }
}
function cycleSpeed() {
  speedIdx=(speedIdx+1)%speeds.length;
  audio.playbackRate=speeds[speedIdx];
  document.getElementById("speed-btn").textContent=`${speeds[speedIdx]}x`;
}

// ── Loop A-B ──────────────────────────────────────────
function setLoopA() { loopA=audio.currentTime; document.getElementById("btn-a").classList.add("set"); updateLoopInfo(); }
function setLoopB() { loopB=audio.currentTime; document.getElementById("btn-b").classList.add("set"); updateLoopInfo(); }
function toggleLoop() {
  if(loopA===null||loopB===null) return;
  if(loopA>=loopB) [loopA,loopB]=[loopB,loopA];
  loopActive=!loopActive;
  document.getElementById("btn-loop").classList.toggle("active",loopActive);
  if(loopActive) audio.currentTime=loopA;
  updateLoopInfo();
}
function resetLoop() {
  loopA=null; loopB=null; loopActive=false;
  ["btn-a","btn-b","btn-loop"].forEach(id=>document.getElementById(id)?.classList.remove("set","active"));
  const lz=document.getElementById("loop-zone"); if(lz) lz.style.display="none";
  const ha=document.getElementById("loop-handle-a"); if(ha) ha.style.display="none";
  const hb=document.getElementById("loop-handle-b"); if(hb) hb.style.display="none";
  const li=document.getElementById("loop-info"); if(li) li.textContent="";
}
function updateLoopInfo() {
  const el=document.getElementById("loop-info"); if(!el) return;
  if(loopA!==null&&loopB!==null) {
    const a=Math.min(loopA,loopB),b=Math.max(loopA,loopB);
    el.textContent=loopActive?`↻ ${fmt(a)}→${fmt(b)}`:`A:${fmt(a)} B:${fmt(b)}`;
    el.style.color=loopActive?"var(--success)":"var(--accent)";
  } else if(loopA!==null) { el.textContent=`A:${fmt(loopA)}`; }
  else el.textContent="";
}
function updateLoopZone() {
  const z  = document.getElementById("loop-zone");
  const ha = document.getElementById("loop-handle-a");
  const hb = document.getElementById("loop-handle-b");
  if (!z) return;

  if (loopA===null && loopB===null) {
    z.style.display="none";
    if(ha) ha.style.display="none";
    if(hb) hb.style.display="none";
    return;
  }

  const dur = audio.duration;
  if (!dur) return;

  // Affiche poignée A seule si B pas encore défini
  if (loopA !== null && ha) {
    const pctA = (Math.min(loopA,dur)/dur*100);
    ha.style.display = "block";
    ha.style.left    = `calc(${pctA}% - 7px)`;
  }
  if (loopB !== null && hb) {
    const pctB = (Math.min(loopB,dur)/dur*100);
    hb.style.display = "block";
    hb.style.left    = `calc(${pctB}% - 7px)`;
  }

  if (loopA===null || loopB===null) {
    z.style.display = "none";
    return;
  }

  const a   = Math.min(loopA,loopB);
  const b   = Math.max(loopA,loopB);
  z.style.display = "block";
  z.style.left    = (a/dur*100)+"%";
  z.style.width   = ((b-a)/dur*100)+"%";
  z.style.background = loopActive
    ? "rgba(61,217,164,.15)"
    : "rgba(124,111,255,.2)";
  z.style.borderLeft  = `2px solid ${loopActive?"var(--success)":"var(--accent)"}`;
  z.style.borderRight = `2px solid ${loopActive?"var(--success)":"var(--accent)"}`;
}

// ── Drag des poignées A et B ──────────────────────────
let draggingHandle = null;

function initHandleDrag(handleEl, isA) {
  function onMove(e) {
    if (draggingHandle !== handleEl) return;
    const r   = document.getElementById("prog-track").getBoundingClientRect();
    const x   = e.touches ? e.touches[0].clientX : e.clientX;
    const pct = Math.max(0, Math.min(1, (x-r.left)/r.width));
    const t   = pct * (audio.duration||0);
    if (isA) loopA = t; else loopB = t;
    updateLoopZone();
    updateLoopInfo();
  }
  function onUp() {
    if (draggingHandle === handleEl) draggingHandle = null;
  }
  handleEl.addEventListener("mousedown",  e => { e.stopPropagation(); draggingHandle=handleEl; });
  handleEl.addEventListener("touchstart", e => { e.stopPropagation(); draggingHandle=handleEl; }, {passive:true});
  document.addEventListener("mousemove",  onMove);
  document.addEventListener("touchmove",  onMove, {passive:true});
  document.addEventListener("mouseup",    onUp);
  document.addEventListener("touchend",   onUp);
}

// Init poignées après chargement DOM
const _ha = document.getElementById("loop-handle-a");
const _hb = document.getElementById("loop-handle-b");
if (_ha) initHandleDrag(_ha, true);
if (_hb) initHandleDrag(_hb, false);

// ── Chapters UI ───────────────────────────────────────
function toggleChapters(id) {
  const p=document.getElementById(`chp-${id}`);
  const b=document.getElementById(`exp-${id}`);
  if(!p) return;
  const o=p.classList.toggle("open");
  if(b) b.textContent=o?"🔼":"📋";
}
function renderChMarkers() {
  const c=document.getElementById("ch-markers"); if(!c) return;
  c.innerHTML="";
  if(!chapters.length) return;
  const render=()=>{
    if(!audio.duration) return;
    chapters.forEach(ch=>{
      const m=document.createElement("div");
      m.className="ch-marker";
      m.style.left=(ch.start/audio.duration*100)+"%";
      c.appendChild(m);
    });
  };
  audio.duration ? render() : audio.addEventListener("loadedmetadata",render,{once:true});
}
function updateActiveChapter() {
  if(!currentTrack||!chapters.length) return;
  const cur = audio.currentTime;
  const rev  = [...chapters].reverse();
  const ai   = rev.findIndex(c=>c.start<=cur);
  const idx  = ai===-1 ? 0 : chapters.length-1-ai;

  chapters.forEach((_,ci)=>{
    const el=document.getElementById(`ch-${currentTrack.id}-${ci}`);
    if(!el) return;
    el.classList.remove("active","done");
    if(ci===idx) el.classList.add("active");
    if(ci<idx)   el.classList.add("done");
  });

  // Affiche chapitre + sous-chapitre dans la barre du lecteur
  const ch = chapters[idx];
  if (!ch) return;

  // Trouve le sous-chapitre actif
  let activeSub = null;
  if (ch.sub && ch.sub.length > 0) {
    const revSub = [...ch.sub].reverse();
    const si     = revSub.findIndex(s => s.start <= cur);
    if (si !== -1) activeSub = revSub[si];
  }

  const np = document.getElementById("now-playing");
  if (!np) return;

  const chNum   = String(idx+1).padStart(2,"0");
  const chTitle = esc(ch.title);
  const subHtml = activeSub
    ? `<span style="display:block;font-size:9px;color:var(--dim);
        font-style:italic;margin-top:1px;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis">
        └ ${esc(activeSub.title)}</span>`
    : "";

  np.innerHTML = `
    <span style="color:var(--accent);font-family:'JetBrains Mono',monospace;
      font-size:9px">${chNum}</span>
    <span style="margin:0 5px;color:var(--dim)">—</span>
    <span style="font-size:12px;font-weight:500">${chTitle}</span>
    <span style="display:block;${subHtml ? '' : 'display:none'}">${subHtml}</span>`;
}

// ── Audio events ──────────────────────────────────────
audio.addEventListener("timeupdate",()=>{
  if(!audio.duration) return;
  const pct=(audio.currentTime/audio.duration)*100;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("t-cur").textContent=fmt(audio.currentTime);
  document.getElementById("t-dur").textContent=fmt(audio.duration);
  if(loopActive&&loopA!==null&&loopB!==null) {
    const a=Math.min(loopA,loopB),b=Math.max(loopA,loopB);
    if(audio.currentTime>=b) audio.currentTime=a;
  }
  if(currentTrack&&Math.round(audio.currentTime)%5===0) {
    saveProgress(currentTrack.id,audio.currentTime);
    const m=document.querySelector(`#card-${currentTrack.id} .prog-mini-fill`);
    if(m) m.style.width=pct+"%";
  }
  updateActiveChapter();
  updateLoopZone();
  updateMediaSessionPosition();
});
audio.addEventListener("play",()=>{
  document.getElementById("play-btn").textContent="⏸";
  if(currentTrack){const b=document.getElementById(`pbtn-${currentTrack.id}`);if(b){b.textContent="⏸";b.classList.add("playing");}}
});
audio.addEventListener("pause",()=>{
  document.getElementById("play-btn").textContent="▶";
  if(currentTrack){const b=document.getElementById(`pbtn-${currentTrack.id}`);if(b){b.textContent="▶";b.classList.remove("playing");}}
});
audio.addEventListener("ended",()=>{ if(currentTrack) saveProgress(currentTrack.id,0); });

// ── Utils ─────────────────────────────────────────────
function fmt(s) {
  if(!s||isNaN(s)) return "0:00";
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
}
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Media Session API — contrôles écran de veille Android/iOS ────────────
function updateMediaSession(track) {
  if (!("mediaSession" in navigator)) return;

  // Métadonnées du podcast
  const artwork = [];
  if (track.thumb_url) {
    artwork.push({ src: track.thumb_url, sizes: "512x512", type: "image/png" });
  }
  navigator.mediaSession.metadata = new MediaMetadata({
    title:  track.title,
    artist: "Mansa Podcaster",
    album:  "Podcast EEA Certif 2026",
    artwork: artwork
  });

  // Actions disponibles sur l'écran de veille
  navigator.mediaSession.setActionHandler("play",          () => audio.play());
  navigator.mediaSession.setActionHandler("pause",         () => audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack", () => skipChapter(-1));
  navigator.mediaSession.setActionHandler("nexttrack",     () => skipChapter(1));
  navigator.mediaSession.setActionHandler("seekbackward",  (d) => seek(-(d?.seekOffset||10)));
  navigator.mediaSession.setActionHandler("seekforward",   (d) => seek(d?.seekOffset||10));
  navigator.mediaSession.setActionHandler("seekto",        (d) => {
    if (d.seekTime !== undefined) audio.currentTime = d.seekTime;
  });
}

function updateMediaSessionPosition() {
  if (!("mediaSession" in navigator)) return;
  if (!audio.duration || isNaN(audio.duration)) return;
  try {
    navigator.mediaSession.setPositionState({
      duration:     audio.duration,
      playbackRate: audio.playbackRate,
      position:     audio.currentTime,
    });
  } catch(e) {}
}

    }).join("");
}

function updateFsPlayer() {
  if (!audio.duration) return;
  const pct = (audio.currentTime/audio.duration)*100;
  const fill = document.getElementById("fs-prog-fill");
  if (fill) fill.style.width = pct+"%";
  const tc = document.getElementById("fs-t-cur");
  const td = document.getElementById("fs-t-dur");
  if (tc) tc.textContent = fmt(audio.currentTime);
  if (td) td.textContent = fmt(audio.duration);

  // Boucle A-B dans FS
  const lz = document.getElementById("fs-loop-zone");
  if (lz && loopA!==null && loopB!==null && audio.duration) {
    const a=Math.min(loopA,loopB), b=Math.max(loopA,loopB);
    lz.style.display="block";
    lz.style.left=(a/audio.duration*100)+"%";
    lz.style.width=((b-a)/audio.duration*100)+"%";
  } else if (lz) { lz.style.display="none"; }

  // Loop info FS
  const li = document.getElementById("fs-loop-info");
  if (li) li.textContent = document.getElementById("loop-info")?.textContent||"";
}

function fsSeeekTo(e) {
  const r = document.getElementById("fs-prog-track").getBoundingClientRect();
  audio.currentTime = ((e.clientX-r.left)/r.width)*(audio.duration||0);
}

// Écoute les événements audio pour mettre à jour le FS
audio.addEventListener("timeupdate", updateFsPlayer);
audio.addEventListener("play", ()=>{
  const b = document.getElementById("fs-play-btn");
  if (b) b.textContent="⏸";
  const sb = document.getElementById("fs-speed-btn");
  if (sb) sb.textContent = document.getElementById("speed-btn")?.textContent||"1.0x";
});
audio.addEventListener("pause", ()=>{
  const b = document.getElementById("fs-play-btn");
  if (b) b.textContent="▶";
});

// Ferme le FS natif si on appuie sur Échap
document.addEventListener("fullscreenchange", ()=>{
  if (!document.fullscreenElement) {
    document.getElementById("fs-overlay").style.display="none";
  }
});
// Touche Échap
document.addEventListener("keydown", e=>{
  if (e.key==="Escape") closeFullscreen();
});
</script>
